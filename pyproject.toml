[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pks-pipeline"
version = "0.1.0"
description = "Traceable pipeline from raw personal notes to reviewable knowledge items"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.20"]

[project.scripts]
pks = "pks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
